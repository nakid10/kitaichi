  const evPills=[];
  if(mode==='weekly'||mode==='all')evPills.push(`<span class="pill">今週の期待値 ${yen(weekly)}</span>`);
  if(mode==='monthly'||mode==='all')evPills.push(`<span class="pill">今月の期待値 ${yen(monthly)}</span>`);
  evPills.push(`<span class="pill">累計期待値 ${yen(earned)}</span>`);
  $('summary').innerHTML=`<span class="pill">履歴 ${histories.length}件</span><span class="pill">累計収支 ${yen(total)}</span>${evPills.join('')}`;
  if(!histories.length){$('historyTable').innerHTML='<div class="small">履歴なし</div>';return}
  $('historyTable').innerHTML='<table><thead><tr><th>日付</th><th>種別</th><th>機種</th><th class="right">G</th><th class="right">EV/収支</th><th>メモ</th><th></th></tr></thead><tbody>'+histories.map((h,i)=>{const v=h.type==='稼働'?(h.profit||0):(h.earnedEv??h.ev??0);return`<tr><td>${new Date(h.date).toLocaleDateString('ja-JP')}</td><td>${h.type}</td><td>${h.machine}<br><span class="small">${h.state||''}</span></td><td class="right">${h.game||0}</td><td class="right ${v>=0?'positive':'danger'}">${yen(v)}</td><td>${h.memo||''}</td><td><button class="btnMini btnDanger" onclick="delHistory(${i})">削除</button></td></tr>`}).join('')+'</tbody></table>'
}
function delHistory(i){histories.splice(i,1);persist();renderHistory()}
function renderMachineJson(){$('machineJson').value=JSON.stringify(machines,null,2)}function saveMachineJson(){try{machines=JSON.parse($('machineJson').value);persist();renderMachineSelect();toast('保存しました')}catch(e){toast('JSON形式エラー')}}function resetMachines(){machines=clone(defaultMachines);persist();renderMachineSelect();renderMachineJson();toast('初期データに戻しました')}
function saveSettings(){settings={...settings,defaultExchange:$('defaultExchange').value,riskLine:Number($('riskLine').value)||15000,evPeriodDisplay:$('evPeriodDisplay').value||'all'};persist();renderStateSelect();renderHistory();toast('設定保存しました')}
function persist(){localStorage.setItem('slotEvMachinesV2',JSON.stringify(machines));localStorage.setItem('slotEvHistoriesV2',JSON.stringify(histories));localStorage.setItem('slotEvSettingsV2',JSON.stringify(settings));localStorage.setItem('slotEvFavoritesV2',JSON.stringify(favorites));localStorage.setItem('slotEvRecentV2',JSON.stringify(recent));localStorage.setItem('slotEvInputHistoryV2',JSON.stringify(inputHistory))}
function exportData(){const data={schemaVersion:SCHEMA_VERSION,machines,histories,settings,favorites,recent,inputHistory,exportedAt:new Date().toISOString()};const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='slot-ev-assist-v2-backup.json';a.click();URL.revokeObjectURL(a.href)}
function migrate(data){if(data.schemaVersion>=2)return data;return{schemaVersion:2,machines:data.machines||machines,histories:data.histories||data.history||[],settings:{...settings,...(data.settings||{})},favorites:data.favorites||[],recent:data.recent||[],inputHistory:data.inputHistory||[]}}
function importData(e){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=migrate(JSON.parse(r.result));machines=d.machines||machines;histories=d.histories||histories;settings=d.settings||settings;favorites=d.favorites||favorites;recent=d.recent||recent;inputHistory=d.inputHistory||inputHistory;persist();init();toast('読み込み完了')}catch(err){toast('読み込み失敗')}};r.readAsText(f)}
init();</script></body></html>
