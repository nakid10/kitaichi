<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>スロット期待値アシスト</title>
  <style>
    :root {
      --bg: #0f172a; --card:#111827; --card2:#1f2937; --text:#f8fafc; --muted:#94a3b8;
      --line:#334155; --good:#22c55e; --warn:#f59e0b; --bad:#ef4444;
    }
    *{box-sizing:border-box} body{margin:0;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:radial-gradient(circle at top,#1e293b 0,var(--bg) 45%);color:var(--text);padding:16px}.app{max-width:980px;margin:0 auto}h1{font-size:24px;margin:8px 0 4px}.sub{color:var(--muted);font-size:13px;margin-bottom:16px}.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}.tabBtn,button{border:1px solid var(--line);background:var(--card2);color:var(--text);padding:11px 10px;border-radius:12px;font-weight:700;cursor:pointer}.tabBtn.active,.btnPrimary{background:linear-gradient(135deg,#0ea5e9,#7c3aed);border-color:transparent}.card{background:rgba(17,24,39,.92);border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:14px;box-shadow:0 12px 34px rgba(0,0,0,.22)}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}label{display:block;font-size:12px;color:var(--muted);margin:0 0 5px 2px}input,select,textarea{width:100%;background:#020617;color:var(--text);border:1px solid var(--line);border-radius:12px;padding:11px;font-size:15px}textarea{min-height:220px;resize:vertical}.result{border-radius:18px;padding:16px;background:#020617;border:1px solid var(--line)}.rank{font-size:32px;font-weight:900;line-height:1}.rank.good{color:var(--good)}.rank.warn{color:var(--warn)}.rank.bad{color:var(--bad)}.ev{font-size:22px;margin-top:6px;font-weight:800}.comment{color:#dbeafe;margin-top:10px;line-height:1.55}.small{color:var(--muted);font-size:12px;line-height:1.55}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.pill{padding:6px 10px;border-radius:999px;background:#0f172a;border:1px solid var(--line);font-size:12px;color:#cbd5e1}.hidden{display:none}table{width:100%;border-collapse:collapse;font-size:13px}th,td{border-bottom:1px solid var(--line);padding:9px 6px;text-align:left}th{color:var(--muted);font-weight:700}.right{text-align:right}.danger{color:var(--bad)}.positive{color:var(--good)}.btnDanger{background:#7f1d1d;border-color:#991b1b}.btnMini{padding:7px 9px;border-radius:10px;font-size:12px}.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#020617;border:1px solid var(--line);padding:10px 14px;border-radius:999px;color:var(--text);display:none}@media(max-width:720px){body{padding:10px}.tabs{grid-template-columns:repeat(2,1fr)}.grid,.grid3{grid-template-columns:1fr}h1{font-size:21px}}

</head>
<body>
<div class="app">
  <h1>スロット期待値アシスト</h1>
  <div class="sub">据え置き店向け。等価交換前提で、当日G・宵越しG・天井短縮を判定する簡易アプリ。</div>

  <div class="tabs">
    <button class="tabBtn active" data-tab="judge">判定する</button>
    <button class="tabBtn" data-tab="history">稼働履歴</button>
    <button class="tabBtn" data-tab="machine">機種データ</button>
    <button class="tabBtn" data-tab="settings">設定</button>
  </div>

  <section id="judge" class="tab">
    <div class="card">
      <div class="grid">
        <div><label>機種</label><select id="machineSelect"></select></div>
        <div><label>狙い状態</label><select id="stateSelect"></select></div>
        <div><label>当日現在G</label><input id="currentGame" type="number" inputmode="numeric" placeholder="例: 240"></div>
        <div><label>前日最終G（宵越し用）</label><input id="prevGame" type="number" inputmode="numeric" placeholder="例: 380 / 不明なら空欄"></div>
        <div><label>計算モード</label><select id="carryoverMode"><option value="today">当日Gのみ</option><option value="carry">宵越し 前日+当日</option></select></div>
        <div><label>液晶G/データランプ補正</label><select id="lampMode"><option value="normal">そのまま計算</option><option value="safe">データランプのみ・安全寄り</option></select></div>
      </div>
      <div style="margin-top:12px" class="row">
        <button class="btnPrimary" onclick="judgeEV()">期待値判定</button>
        <button onclick="saveCandidate()">候補として保存</button>
        <button onclick="saveEarnedEV()">稼いだ期待値として記録</button>
      </div>
    </div>

    <div class="card result" id="resultBox">
      <div class="rank warn">判定待ち</div>
      <div class="ev">ゲーム数を入れて判定してください</div>
      <div class="comment">据え置き宵越しは「前日最終G + 当日現在G」で計算します。あべしや内部ptが見えない時は安全寄り判定にできます。</div>
    </div>

    <div class="card"><h3>現在の機種メモ</h3><div id="machineMemo" class="small"></div></div>
  </section>

  <section id="history" class="tab hidden">
    <div class="card">
      <h3>稼働入力</h3>
      <div class="grid3">
        <div><label>機種名</label><input id="playMachine"></div>
        <div><label>開始G</label><input id="startG" type="number"></div>
        <div><label>終了G</label><input id="endG" type="number"></div>
        <div><label>投資 円</label><input id="investYen" type="number"></div>
        <div><label>回収 円</label><input id="returnYen" type="number"></div>
        <div><label>メモ</label><input id="playMemo"></div>
      </div>
      <div style="margin-top:12px" class="row"><button class="btnPrimary" onclick="addHistory()">履歴追加</button><button onclick="exportData()">JSON書き出し</button><button onclick="document.getElementById('importFile').click()">JSON読み込み</button><input id="importFile" type="file" accept="application/json" class="hidden" onchange="importData(event)"></div>
    </div>
    <div class="card"><h3>累計</h3><div id="summary" class="row"></div><div id="evSummary" class="small" style="margin-top:10px"></div></div>
    <div class="card"><h3>履歴</h3><div id="historyTable"></div></div>
  </section>

  <section id="machine" class="tab hidden">
    <div class="card">
      <h3>機種データ編集</h3>
      <div class="small">JSONを直接編集できます。evTableはゲーム数と等価期待値円の対応表です。期待値表をもらったらここに反映します。</div>
      <textarea id="machineJson"></textarea>
      <div style="margin-top:12px" class="row"><button class="btnPrimary" onclick="saveMachineJson()">保存</button><button onclick="resetMachines()">初期データに戻す</button></div>
    </div>
  </section>

  <section id="settings" class="tab hidden">
    <div class="card">
      <h3>判定基準</h3>
      <div class="grid">
        <div><label>Sランク期待値 円以上</label><input id="sLine" type="number" value="3000"></div>
        <div><label>Aランク期待値 円以上</label><input id="aLine" type="number" value="1500"></div>
        <div><label>Bランク期待値 円以上</label><input id="bLine" type="number" value="500"></div>
        <div><label>平均投資 警戒ライン 円</label><input id="riskLine" type="number" value="15000"></div>
      </div>
      <div style="margin-top:12px" class="row"><button class="btnPrimary" onclick="saveSettings()">保存</button></div>
    </div>
    <div class="card small">注意：このアプリは期待値稼働の補助用です。等価交換前提です。天井短縮条件・閉店時間・前任者のヤメ方は必ず確認してください。</div>
  </section>
</div>
<div id="toast" class="toast"></div>

      {id:"short",name:"天井短縮あり",aim:{equiv:200},evTable:[{g:0,ev:-650},{g:50,ev:-232},{g:100,ev:244},{g:150,ev:789},{g:200,ev:1410},{g:250,ev:2118},{g:300,ev:2927},{g:350,ev:3850},{g:400,ev:4904},{g:450,ev:6106},{g:500,ev:7479},{g:550,ev:9045}],note:"天井短縮あり。等価では200G〜が実戦ライン。100Gから一応プラス。短縮根拠が弱いなら通常扱い。"}
    ]
  }
];

let machines=JSON.parse(localStorage.getItem('slotEvMachinesV2')||'null')||defaultMachines;
let histories=JSON.parse(localStorage.getItem('slotEvHistoriesV2')||'[]');
let settings=JSON.parse(localStorage.getItem('slotEvSettingsV2')||'null')||{sLine:3000,aLine:1500,bLine:500,riskLine:15000};
let lastJudge=null;
const $=id=>document.getElementById(id); const yen=n=>Math.round(n).toLocaleString('ja-JP')+'円';
function toast(msg){const t=$('toast');t.textContent=msg;t.style.display='block';setTimeout(()=>t.style.display='none',1600)}
function init(){document.querySelectorAll('.tabBtn').forEach(btn=>btn.addEventListener('click',()=>showTab(btn.dataset.tab)));$('machineSelect').addEventListener('change',renderStateSelect);$('stateSelect').addEventListener('change',renderMemo);$('sLine').value=settings.sLine;$('aLine').value=settings.aLine;$('bLine').value=settings.bLine;$('riskLine').value=settings.riskLine;renderMachineSelect();renderHistory();renderMachineJson()}
function showTab(id){document.querySelectorAll('.tab').forEach(t=>t.classList.add('hidden'));document.querySelectorAll('.tabBtn').forEach(b=>b.classList.remove('active'));$(id).classList.remove('hidden');document.querySelector(`[data-tab="${id}"]`).classList.add('active');if(id==='machine')renderMachineJson()}
function renderMachineSelect(){$('machineSelect').innerHTML=machines.map(m=>`<option value="${m.id}">${m.name}</option>`).join('');renderStateSelect()}
function currentMachine(){return machines.find(m=>m.id===$('machineSelect').value)||machines[0]} function currentState(){const m=currentMachine();return m.states.find(s=>s.id===$('stateSelect').value)||m.states[0]}
function renderStateSelect(){const m=currentMachine();$('stateSelect').innerHTML=m.states.map(s=>`<option value="${s.id}">${s.name}</option>`).join('');renderMemo()}
function renderMemo(){const m=currentMachine(),s=currentState();$('machineMemo').innerHTML=`<div class="row"><span class="pill">単位: ${m.unit}</span><span class="pill">状態: ${s.name}</span><span class="pill">等価専用</span></div><p>${m.memo}</p><p>${s.note}</p>`}
function interpolateEV(table,g){const rows=[...table].sort((a,b)=>a.g-b.g);if(g<=rows[0].g)return rows[0].ev;if(g>=rows[rows.length-1].g)return rows[rows.length-1].ev;for(let i=0;i<rows.length-1;i++){const a=rows[i],b=rows[i+1];if(g>=a.g&&g<=b.g){const r=(g-a.g)/(b.g-a.g);return a.ev+(b.ev-a.ev)*r}}return 0}
function estimateRisk(g,state){const rows=[...state.evTable].sort((a,b)=>a.g-b.g);const maxG=rows[rows.length-1].g;const remainRatio=Math.max(0,(maxG-g)/maxG);const base=currentMachine().avgInvestBase||12000;return base*(0.35+remainRatio*0.9)}
function rankFromEv(ev,g,state,machine){
  if(machine?.id==='hokuto_smart' && state?.id==='normal' && g>=400 && g<500){
    return {rank:'ギリOK',cls:'warn',text:'スマスロ北斗専用の薄めライン。期待値は弱いが、宵越し・他に打つ台なし・時間に余裕ありなら候補。'};
  }
  if(ev>=settings.sLine)return{rank:'S',cls:'good',text:'期待値かなり強い。優先して打ちたい。'};
  if(ev>=settings.aLine)return{rank:'A',cls:'good',text:'期待値あり。条件が合うなら打てる。'};
  if(ev>=settings.bLine)return{rank:'B',cls:'warn',text:'一応プラス圏。ただし閉店時間・天井短縮根拠に注意。'};
  if(ev>=0)return{rank:'C',cls:'warn',text:'微プラス〜トントン寄り。無理に打つほどではない。'};
  return{rank:'見送り',cls:'bad',text:'期待値不足。今は触らない方が安全。'}
}
function judgeEV(){const todayG=Number($('currentGame').value);const prevG=Number($('prevGame').value||0);if(Number.isNaN(todayG)||todayG<0){toast('当日現在Gを入れてください');return}let g=$('carryoverMode').value==='carry'?todayG+prevG:todayG;const m=currentMachine(),s=currentState();let rawEv=interpolateEV(s.evTable,g);let safePenalty=0;if($('lampMode').value==='safe'){safePenalty=Math.max(300,rawEv*0.15);rawEv-=safePenalty}const risk=estimateRisk(g,s);const r=rankFromEv(rawEv,g,s,m);const aim=s.aim?.equiv??0;const riskWarn=risk>=settings.riskLine?`<span class="danger">平均投資が重め。所持金が薄い日は危険。</span>`:`<span class="positive">投資リスクは許容範囲寄り。</span>`;const below=g<aim?`狙い目ライン${aim}Gより浅いので慎重。`:`狙い目ライン${aim}G以上。`;lastJudge={date:new Date().toISOString(),machine:m.name,state:s.name,game:g,ev:Math.round(rawEv),risk:Math.round(risk),memo:s.note};$('resultBox').innerHTML=`<div class="rank ${r.cls}">${r.rank}</div><div class="ev">推定期待値：${yen(rawEv)}</div><div class="row" style="margin-top:10px"><span class="pill">判定G ${g}G</span><span class="pill">当日 ${todayG}G</span><span class="pill">前日 ${prevG}G</span><span class="pill">平均投資目安 ${yen(risk)}</span>${safePenalty?`<span class="pill">安全補正 -${yen(safePenalty)}</span>`:''}</div><div class="comment">${r.text}<br>${below}<br>${riskWarn}<br><br>押し引き：S/Aは候補、Bは時間・短縮根拠ありなら可、C以下は基本見送り。</div>`}
function saveCandidate(){if(!lastJudge){judgeEV();if(!lastJudge)return}histories.unshift({...lastJudge,type:'候補',invest:0,ret:0,profit:0,earnedEv:0});persist();renderHistory();toast('候補に保存しました')}
function saveEarnedEV(){if(!lastJudge){judgeEV();if(!lastJudge)return}histories.unshift({...lastJudge,type:'期待値',invest:0,ret:0,profit:0,earnedEv:lastJudge.ev});persist();renderHistory();toast('稼いだ期待値として記録しました')}
function addHistory(){const invest=Number($('investYen').value||0),ret=Number($('returnYen').value||0);histories.unshift({date:new Date().toISOString(),type:'稼働',machine:$('playMachine').value||'未入力',state:'',game:Number($('startG').value||0),endGame:Number($('endG').value||0),invest,ret,profit:ret-invest,memo:$('playMemo').value||''});persist();renderHistory();toast('履歴を追加しました')}
function renderHistory(){
  const total=histories.reduce((a,h)=>a+(h.profit||0),0);
  const earnedTotal=histories.reduce((a,h)=>a+(h.earnedEv||0),0);
  const plays=histories.filter(h=>h.type==='稼働').length;
  const evPlays=histories.filter(h=>h.type==='期待値').length;
  const avg=plays?total/plays:0;
  const evAvg=evPlays?earnedTotal/evPlays:0;
  $('summary').innerHTML=`<span class="pill">稼働 ${plays}件</span><span class="pill">累計収支 ${yen(total)}</span><span class="pill">平均収支 ${yen(avg)}</span><span class="pill">稼いだ期待値 ${yen(earnedTotal)}</span><span class="pill">平均EV ${yen(evAvg)}</span>`;
  $('evSummary').innerHTML=`期待値記録は「実際に打った台の理論上積めた期待値」を残す欄。収支が荒れても、長期で期待値を積めているか確認できます。`;
  if(!histories.length){$('historyTable').innerHTML='<div class="small">まだ履歴がありません。</div>';return}
  $('historyTable').innerHTML=`<table><thead><tr><th>日付</th><th>種別</th><th>機種</th><th class="right">G</th><th class="right">EV/収支</th><th>メモ</th><th></th></tr></thead><tbody>`+histories.map((h,i)=>{
    const d=new Date(h.date).toLocaleString('ja-JP',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'});
    const val=h.type==='稼働'?h.profit:(h.type==='期待値'?h.earnedEv:h.ev);
    const label=h.type==='期待値'?'EV':(h.type==='稼働'?'収支':'候補EV');
    return`<tr><td>${d}</td><td>${h.type}</td><td>${h.machine}<br><span class="small">${h.state||''}</span></td><td class="right">${h.game||0}</td><td class="right ${val>=0?'positive':'danger'}">${label}: ${yen(val||0)}</td><td>${h.memo||''}</td><td><button class="btnMini btnDanger" onclick="delHistory(${i})">削除</button></td></tr>`
  }).join('')+`</tbody></table>`
}
function delHistory(i){histories.splice(i,1);persist();renderHistory()}
function renderMachineJson(){$('machineJson').value=JSON.stringify(machines,null,2)}
function saveMachineJson(){try{machines=JSON.parse($('machineJson').value);persist();renderMachineSelect();toast('機種データを保存しました')}catch(e){toast('JSON形式が正しくありません')}}
function resetMachines(){machines=structuredClone(defaultMachines);persist();renderMachineSelect();renderMachineJson();toast('初期データに戻しました')}
function saveSettings(){settings={sLine:Number($('sLine').value),aLine:Number($('aLine').value),bLine:Number($('bLine').value),riskLine:Number($('riskLine').value)};persist();toast('設定を保存しました')}
function persist(){localStorage.setItem('slotEvMachinesV2',JSON.stringify(machines));localStorage.setItem('slotEvHistoriesV2',JSON.stringify(histories));localStorage.setItem('slotEvSettingsV2',JSON.stringify(settings))}
function exportData(){const data={machines,histories,settings,exportedAt:new Date().toISOString()};const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='slot-ev-assist-backup.json';a.click();URL.revokeObjectURL(a.href)}
function importData(e){const file=e.target.files[0];if(!file)return;const reader=new FileReader();reader.onload=()=>{try{const data=JSON.parse(reader.result);machines=data.machines||machines;histories=data.histories||histories;settings=data.settings||settings;persist();init();toast('読み込み完了')}catch(err){toast('読み込み失敗')}};reader.readAsText(file)}
init();
</script>
</body>
</html>
